<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="量力 · 反假性自律的个人成长工具">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>量力 Liangli</title>
<style>
:root{
  --ink:#0b0c0f;--ink-soft:#17181d;--panel:#202127;
  --paper:#ede6d8;--paper-dim:#c9c0b1;--muted:#9f988e;
  --blood:#d92d45;--power-pink:#ff5f8f;--warning:#f1c84b;
  --line:#050608;--focus:#ffd769;
  --bg:var(--ink);--card:var(--ink-soft);--card2:var(--panel);
  --txt:var(--paper);--sub:var(--muted);--accent:var(--blood);--accent2:var(--power-pink);
  --ok:#2f9c68;--warn:var(--warning);--danger:var(--blood);--r:0;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#05060a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif;color:var(--txt);display:flex;justify-content:center;min-height:100dvh}
.app{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.6)}
header{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
header h1{font-size:19px;margin:0}
header .sl{color:var(--sub);font-size:11px;display:block;margin-top:1px}
.langbtn{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:4px 14px calc(96px + var(--safe-b));-webkit-overflow-scrolling:touch}
.view{display:none}.view.active{display:block;animation:f .22s ease}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 11px;font-weight:600}
.muted{color:var(--sub);font-size:12.5px;line-height:1.6}
.gauge{height:13px;border-radius:10px;background:var(--card2);overflow:hidden}
.gauge>span{display:block;height:100%;border-radius:10px;transition:width .4s,background .3s}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gh b{font-size:25px}
.warnbox{margin-top:10px;background:rgba(255,92,92,.12);border:1px solid rgba(255,92,92,.35);color:#ffb3b3;padding:9px 12px;border-radius:11px;font-size:12.5px;line-height:1.5;display:none}
.warnbox.show{display:block}
.companion-stage{height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card2);border-radius:11px;margin-bottom:6px}
.companion-stage video{width:170px;height:170px;display:block;object-fit:contain;background:var(--card2);transition:opacity .25s ease}
.companion-picker{display:flex;gap:6px;max-width:260px;margin:0 auto 12px;padding:3px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.companion-picker button{min-height:36px;flex:1;border:0;border-radius:9px;background:transparent;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;padding:7px 9px}
.companion-picker button[aria-pressed="true"]{background:rgba(255,138,92,.18);color:#ffdcc2;box-shadow:inset 0 0 0 1px rgba(255,138,92,.45)}
.item{display:flex;align-items:center;gap:9px;padding:10px 11px;background:var(--card2);border-radius:11px;margin-bottom:7px}
.item:last-child{margin-bottom:0}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid var(--line);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .t{text-decoration:line-through;color:var(--sub)}
.t{flex:1;font-size:13.5px;word-break:break-word;line-height:1.4}
.tag{font-size:10.5px;color:var(--sub);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:20px;flex:none}
.x{color:var(--sub);cursor:pointer;font-size:17px;padding:0 3px;flex:none;line-height:1}
.row{display:flex;gap:8px;margin-top:10px}
input,textarea,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 11px;font-size:14px;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:76px;line-height:1.5}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600;border-radius:10px;padding:10px 15px;font-size:13.5px;cursor:pointer;flex:none;white-space:nowrap;font-family:inherit}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.full{width:100%}
.pick{display:flex;gap:6px;margin-top:8px}
.pick div{flex:1;text-align:center;padding:8px 0;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:11.5px;cursor:pointer}
.pick div.sel{border-color:var(--accent);background:rgba(255,138,92,.15);color:#ffdcc2}
.ring{width:180px;height:180px;margin:4px auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tm b{font-size:38px;font-variant-numeric:tabular-nums}
.ring .tm small{color:var(--sub);font-size:11.5px;margin-top:2px}
.tctl{display:flex;gap:9px;justify-content:center}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--card2);border-radius:11px;padding:11px 6px;text-align:center}
.stat b{font-size:21px;display:block}
.stat small{color:var(--sub);font-size:10.5px}
.bars{display:flex;align-items:flex-end;gap:7px;height:100px;margin-top:13px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:5px 5px 0 0;min-height:3px;transition:height .5s}
.bars .b span{font-size:9.5px;color:var(--sub)}
.goal{background:var(--card2);border-radius:11px;padding:12px;margin-bottom:8px}
.goal .gt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.goal .gt b{font-size:13.5px;flex:1;font-weight:500}
.gbar{height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:7px}
.gbar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.gfoot{display:flex;align-items:center;gap:8px}
.gfoot small{color:var(--sub);font-size:11px;flex:1}
.step{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.07);border:none;color:var(--txt);font-size:15px;cursor:pointer;line-height:1;flex:none;font-family:inherit}
.log{background:var(--card2);border-radius:11px;padding:12px;margin-bottom:8px;position:relative}
.log .lh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.log .lh b{font-size:12px;color:var(--sub);font-weight:500}
.mood{font-size:15px}
.log p{margin:0;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.moodpick{display:flex;gap:6px;margin-top:9px}
.moodpick div{flex:1;text-align:center;padding:7px 0;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:17px;cursor:pointer}
.moodpick div.sel{border-color:var(--accent);background:rgba(255,138,92,.15)}
.empty{color:var(--sub);font-size:12.5px;text-align:center;padding:16px 0;line-height:1.6}
nav{position:absolute;bottom:0;left:0;right:0;background:rgba(15,17,21,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:7px 4px calc(9px + var(--safe-b))}
nav button{flex:1;background:none;border:none;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0;font-family:inherit}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--accent)}
.toast{position:fixed;bottom:calc(100px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(12px);background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{background:rgba(255,138,92,.08);border:1px solid rgba(255,138,92,.25);color:#ffdcc2;padding:10px 12px;border-radius:11px;font-size:12px;line-height:1.55;margin-bottom:12px}

/* ============ cinematic manga visual system ============ */
body{
  background:
    radial-gradient(circle at 18% 12%,rgba(255,95,143,.13),transparent 24%),
    repeating-linear-gradient(118deg,#050608 0 3px,#0b0c0f 3px 13px);
}
.app{background:var(--ink);box-shadow:0 0 0 3px var(--line),0 0 70px rgba(217,45,69,.16)}
header{position:relative;border-bottom:3px solid var(--line);background:var(--paper);color:var(--ink);overflow:hidden}
header::after{content:"";position:absolute;right:-22px;top:-46px;width:120px;height:150px;background:repeating-radial-gradient(circle,var(--line) 0 1px,transparent 1px 5px);opacity:.16;transform:rotate(-16deg);pointer-events:none}
.logo{border:3px solid var(--line);border-radius:50% 44% 48% 38%;background:var(--blood);color:#fff;box-shadow:3px 3px 0 var(--line);transform:rotate(-5deg)}
header h1{font-family:"Kaiti SC","STKaiti","Segoe Print",cursive;font-weight:900;letter-spacing:.08em}
header .sl{color:#4c4a48;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.langbtn{position:relative;z-index:1;min-height:44px;background:var(--warning);border:3px solid var(--line);border-radius:0;color:var(--ink);font-weight:900;box-shadow:3px 3px 0 var(--line)}
main{padding:14px 12px calc(104px + var(--safe-b));background:linear-gradient(90deg,transparent 49%,rgba(237,230,216,.035) 50%,transparent 51%)}
.view.active{animation:panelCut .24s steps(3,end)}
@keyframes panelCut{from{opacity:.15;clip-path:polygon(0 18%,100% 0,89% 100%,8% 82%)}to{opacity:1;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}

.manga-panel{
  position:relative;background:var(--paper);color:var(--ink);
  border:3px solid var(--line);box-shadow:5px 6px 0 var(--line);
  padding:16px;margin:0 4px 18px;overflow:hidden;border-radius:0;
}
.manga-panel:nth-of-type(even){transform:rotate(.55deg)}
.manga-title{font-family:"Kaiti SC","STKaiti","Segoe Print",cursive;font-size:18px;font-weight:900;line-height:1.15;letter-spacing:.04em;text-transform:uppercase}
.card h2.manga-title{font-size:18px;font-weight:900}
.manga-title::after{content:"";display:block;width:42px;height:5px;margin-top:6px;background:var(--blood);clip-path:polygon(0 20%,100% 0,92% 100%,4% 72%)}
.manga-decor{pointer-events:none;position:absolute;inset:0;z-index:0}
.manga-panel>*:not(.manga-decor){position:relative;z-index:1}
.manga-view .muted{color:#5f5a54;font-weight:600}
.manga-view input,.manga-view textarea,.manga-view select{background:#fffdf6;border:2px solid var(--line);border-radius:0;color:var(--ink);box-shadow:inset 3px 3px 0 rgba(11,12,15,.08)}
.manga-view input:focus,.manga-view textarea:focus{border-color:var(--blood)}
button,input,textarea,select{min-height:44px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn{min-height:44px;background:var(--blood);border:3px solid var(--line);border-radius:0;color:#fff;font-weight:900;box-shadow:3px 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--paper);border:2px solid var(--line);color:var(--ink);box-shadow:2px 2px 0 var(--line)}
.btn.sm{min-height:44px}
.row{align-items:stretch}
.manga-view .row>*{min-width:0}
.item{background:#fffdf6;border:2px solid var(--line);border-radius:0;box-shadow:2px 2px 0 rgba(11,12,15,.22)}
.chk{width:44px;height:44px;border:2px solid var(--line);border-radius:50% 42% 47% 39%;color:#fff;font-weight:900}
.item.done .chk{background:var(--blood);border-color:var(--line)}
.tag{background:var(--warning);border:1px solid var(--line);border-radius:0;color:var(--ink);font-weight:900}
.x{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:var(--ink);font-weight:900}
.empty{color:#5f5a54;border:2px dashed #6a655e;background:rgba(255,255,255,.3)}

/* Today: close-up hero, warning tape gauge, overload impact burst. */
.today-view .hero-panel{padding:0 0 16px;background:var(--ink-soft);color:var(--paper)}
.today-view .hero-panel>*:not(.manga-decor){margin-left:16px;margin-right:16px}
.today-view .hero-panel .companion-stage{margin-left:0;margin-right:0}
.hero-rays{background:repeating-conic-gradient(from 12deg at 50% 35%,transparent 0 7deg,rgba(255,255,255,.08) 7deg 9deg);opacity:.7}
.companion-stage{height:218px;background:linear-gradient(145deg,#2b2c33,var(--ink));border:0;border-bottom:3px solid var(--line);border-radius:0;margin-bottom:10px}
.companion-stage video{width:218px;height:218px;background:transparent;filter:contrast(1.1) saturate(.88)}
.companion-picker{background:var(--paper);border:2px solid var(--line);border-radius:0}
.companion-picker button{min-height:44px;border-radius:0;color:var(--ink);font-weight:900}
.companion-picker button[aria-pressed="true"]{background:var(--power-pink);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.today-view .gh .muted{color:var(--paper-dim)}
.gauge{height:20px;border:3px solid var(--line);border-radius:0;background:repeating-linear-gradient(135deg,var(--warning) 0 12px,var(--ink) 12px 18px);padding:2px}
.gauge>span{border-radius:0;mix-blend-mode:screen}
.warnbox{position:relative;background:var(--warning);border:3px solid var(--line);border-radius:0;color:var(--ink);font-weight:900;box-shadow:4px 4px 0 var(--blood)}
.warnbox.show{animation:overloadHit .38s steps(2,end) 1}
.warnbox.show::before{content:"!";position:absolute;right:-3px;top:-34px;width:52px;height:52px;display:grid;place-items:center;background:var(--blood);color:#fff;border:3px solid var(--line);clip-path:polygon(50% 0,62% 25%,86% 8%,80% 36%,100% 44%,76% 57%,93% 82%,64% 74%,52% 100%,42% 74%,12% 92%,20% 61%,0 50%,25% 39%,9% 13%,39% 27%);font-size:25px}
@keyframes overloadHit{0%{transform:scale(.82) rotate(-2deg)}55%{transform:scale(1.04) rotate(1deg)}100%{transform:scale(1)}}
.task-entry-panel::after{content:"";position:absolute;right:-28px;bottom:-36px;width:110px;height:110px;border:18px double rgba(217,45,69,.12);border-radius:50%;pointer-events:none}
.pick div,.moodpick div{min-height:44px;display:grid;place-items:center;background:#fffdf6;border:2px solid var(--line);border-radius:0;color:var(--ink);font-weight:800}
.pick div.sel,.moodpick div.sel{border-color:var(--line);background:var(--warning);color:var(--ink);box-shadow:3px 3px 0 var(--line)}

/* Pool: a deterministic wall of torn notes. */
.pool-grid{background:repeating-linear-gradient(0deg,transparent 0 18px,rgba(11,12,15,.08) 18px 19px)}
.pool-view #ideaList{padding:10px 4px}
.pool-view .torn-note{position:relative;padding:16px 10px;background:#fff9c9;clip-path:polygon(0 3%,8% 0,19% 3%,31% 0,46% 2%,61% 0,74% 3%,88% 0,100% 3%,98% 96%,87% 100%,72% 97%,58% 100%,43% 97%,29% 100%,14% 97%,1% 100%);transform-origin:center;box-shadow:none}
.pool-view .torn-note:nth-child(3n+1){transform:rotate(-1.4deg);background:#fff3a8}
.pool-view .torn-note:nth-child(3n+2){transform:rotate(.9deg);background:#f8dce5}
.pool-view .torn-note:nth-child(3n+3){transform:rotate(-.35deg);background:#dce9e5}

/* Goals: chapter cards with segmented ink progress. */
.chapter-decor{background:linear-gradient(135deg,rgba(11,12,15,.06) 25%,transparent 25% 75%,rgba(217,45,69,.06) 75%)}
.goals-view .chapter-card{position:relative;background:#fffdf6;border:3px solid var(--line);border-radius:0;padding:28px 12px 12px;box-shadow:4px 4px 0 var(--blood)}
.goals-view .chapter-card::before{content:"CHAPTER";position:absolute;left:-3px;top:-3px;padding:4px 9px;background:var(--ink);color:var(--paper);font-size:9px;font-weight:900;letter-spacing:.18em}
.goal-entry-panel .row{flex-wrap:wrap}
.goal-entry-panel #goalTarget,.goal-entry-panel #goalUnit{flex:1 1 calc(50% - 4px)!important}
.goal-entry-panel .row .btn{width:100%}
.gbar{height:14px;border:2px solid var(--line);border-radius:0;background:repeating-linear-gradient(90deg,var(--paper-dim) 0 16px,var(--line) 16px 18px);padding:2px}
.gbar>span{border-radius:0;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,var(--blood) 14px 16px)}
.step{width:44px;height:44px;border:2px solid var(--line);border-radius:0;background:var(--warning);color:var(--ink);font-weight:900;box-shadow:2px 2px 0 var(--line)}

/* Focus: title-card timer and clapperboard controls. */
.focus-view .timer-panel{background:var(--ink-soft);color:var(--paper);padding-top:18px}
.focus-view .timer-panel .manga-title::after{background:var(--power-pink)}
.focus-view .ring{width:100%;height:190px;margin:0 auto 14px;border:3px solid var(--paper);background:repeating-linear-gradient(135deg,rgba(237,230,216,.08) 0 7px,transparent 7px 16px)}
.focus-view .ring svg{position:absolute;inset:5px;margin:auto;opacity:.18}
.focus-view .ring .tm b{font-family:"Arial Narrow","Roboto Condensed",Impact,sans-serif;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;text-shadow:4px 4px 0 var(--blood)}
.focus-view .ring .tm small{color:var(--paper-dim);font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.clapper-controls{gap:4px;padding:8px;background:repeating-linear-gradient(135deg,var(--paper) 0 15px,var(--ink) 15px 29px);border:3px solid var(--line)}
.clapper-controls .btn{flex:1}
.stats{gap:5px}
.stat{background:var(--ink);border:2px solid var(--line);border-radius:0;color:var(--paper);padding:13px 4px}
.stat b{font-family:Impact,"Arial Black",sans-serif;color:var(--warning)}
.stat small{color:var(--paper-dim)}
.bars .b i{border:2px solid var(--line);border-bottom:0;border-radius:0;background:repeating-linear-gradient(135deg,var(--blood) 0 7px,var(--power-pink) 7px 11px)}
.bars .b span{color:var(--ink);font-weight:900}

/* Journal: level film frames; the written copy never tilts. */
.film-decor{background:radial-gradient(circle at 8px 8px,var(--ink) 0 3px,transparent 4px) 0 0/24px 24px;opacity:.08}
.journal-view .log{position:relative;margin:12px 4px;padding:18px 16px 18px 26px;background:#fffdf6;border:3px solid var(--line);border-radius:0;box-shadow:4px 4px 0 var(--line);transform:none}
.journal-view .log::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:9px;background:repeating-linear-gradient(180deg,var(--ink) 0 7px,transparent 7px 14px)}
.journal-view .log::after{content:"";position:absolute;right:5px;top:4px;bottom:4px;width:9px;background:repeating-linear-gradient(180deg,var(--ink) 0 7px,transparent 7px 14px)}
.journal-view .log p,.journal-view .log .lh{position:relative;z-index:1;transform:none;color:var(--ink)}
.journal-view .journal-list-panel{transform:none}
.hint{background:var(--warning);border:2px solid var(--line);border-radius:0;color:var(--ink);font-weight:700}

nav{background:var(--paper);border-top:3px solid var(--line);padding-top:5px}
nav button{min-height:54px;color:#4a4742;font-weight:800;transition:transform .12s,background .12s}
nav button.active{background:var(--blood);color:#fff;transform:translateY(-5px) rotate(-1deg);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line)}
.toast{background:var(--warning);border:3px solid var(--line);border-radius:0;color:var(--ink);font-weight:900;box-shadow:4px 4px 0 var(--line)}

@media (min-width:390px){
  .focus-view .ring .tm b{font-size:72px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .manga-panel{transform:none}
  .pool-view .torn-note{transform:none}
  nav button.active{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">量</div>
    <div><h1 id="appName">量力</h1><span class="sl" id="tagline">反假性自律</span></div>
    <button class="langbtn" onclick="toggleLang()" id="langBtn">EN</button>
  </header>

  <main>
    <!-- ========== 今日 ========== -->
    <section class="view manga-view today-view active" id="v-today">
      <div class="card manga-panel hero-panel">
        <div class="manga-decor hero-rays" aria-hidden="true"></div>
        <div class="companion-stage">
          <video id="companionVideo" autoplay muted loop playsinline aria-hidden="true"></video>
        </div>
        <div class="companion-picker" id="companionPicker" role="group" aria-label="Companion">
          <button type="button" data-companion="cat" aria-pressed="true" onclick="setCompanion('cat')"><span data-i="companionCat">Power 猫</span></button>
          <button type="button" data-companion="human" aria-pressed="false" onclick="setCompanion('human')"><span data-i="companionHuman">人形 Power</span></button>
        </div>
        <div class="gh">
          <span class="muted" data-i="loadTitle">今日精力负荷</span>
          <b><span id="loadUsed">0</span><span class="muted" style="font-size:13px"> / <span id="loadMax">100</span></span></b>
        </div>
        <div class="gauge"><span id="loadBar" style="width:0%;background:var(--ok)"></span></div>
        <div class="warnbox" id="loadWarn" data-i="loadWarn"></div>
      </div>

      <div class="card manga-panel task-entry-panel">
        <h2 class="manga-title" data-i="addTask">添加任务</h2>
        <input id="taskName" data-ph="taskPh" placeholder="今天想完成什么？">
        <div class="muted" style="margin-top:11px" data-i="energyLabel">预估精力消耗</div>
        <div class="pick" id="energyPick">
          <div data-e="10" data-i="eLight">轻 10</div>
          <div data-e="25" class="sel" data-i="eMid">中 25</div>
          <div data-e="45" data-i="eHeavy">重 45</div>
        </div>
        <div class="row"><button class="btn full" onclick="addTask()" data-i="addToday">加入今日</button></div>
      </div>

      <div class="card manga-panel task-list-panel">
        <h2 class="manga-title" data-i="todayTasks">今日任务</h2>
        <div id="taskList"></div>
      </div>
    </section>

    <!-- ========== 成长池 ========== -->
    <section class="view manga-view pool-view" id="v-pool">
      <div class="card manga-panel pool-entry-panel">
        <div class="manga-decor pool-grid" aria-hidden="true"></div>
        <h2 class="manga-title" data-i="poolTitle">成长池</h2>
        <p class="muted" data-i="poolDesc">突然冒出来的想法先存这儿，不逼自己马上做。等状态好、精力有富余时，再一键转成今日任务。</p>
        <div class="row">
          <input id="ideaName" data-ph="ideaPh" placeholder="比如：想学一点心理学…">
          <button class="btn" onclick="addIdea()" data-i="save">存起来</button>
        </div>
      </div>
      <div class="card manga-panel pool-list-panel">
        <h2 class="manga-title" data-i="myIdeas">我的想法</h2>
        <div id="ideaList"></div>
      </div>
    </section>

    <!-- ========== 目标 ========== -->
    <section class="view manga-view goals-view" id="v-goals">
      <div class="card manga-panel goal-entry-panel">
        <div class="manga-decor chapter-decor" aria-hidden="true"></div>
        <h2 class="manga-title" data-i="addGoal">新目标</h2>
        <input id="goalName" data-ph="goalPh" placeholder="比如：读完 12 本书">
        <div class="row">
          <input id="goalTarget" type="number" min="1" value="10" style="flex:1" inputmode="numeric">
          <input id="goalUnit" data-ph="unitPh" placeholder="单位" style="flex:1">
          <button class="btn" onclick="addGoal()" data-i="create">创建</button>
        </div>
      </div>
      <div class="card manga-panel goal-list-panel">
        <h2 class="manga-title" data-i="myGoals">我的目标</h2>
        <div id="goalList"></div>
      </div>
    </section>

    <!-- ========== 专注 ========== -->
    <section class="view manga-view focus-view" id="v-focus">
      <div class="card manga-panel timer-panel">
        <div class="manga-decor timer-decor" aria-hidden="true"></div>
        <h2 class="manga-title" data-i="pomo">番茄钟</h2>
        <div style="text-align:center">
          <div class="ring">
            <svg width="180" height="180" viewBox="0 0 180 180">
              <circle cx="90" cy="90" r="80" stroke="#22262e" stroke-width="11" fill="none"/>
              <circle id="ringFg" cx="90" cy="90" r="80" stroke="url(#gr)" stroke-width="11" fill="none"
                      stroke-linecap="round" stroke-dasharray="502.4" stroke-dashoffset="0"/>
              <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ffb26b"/>
              </linearGradient></defs>
            </svg>
            <div class="tm"><b id="clock">25:00</b><small id="clabel" data-i="ready">准备开始</small></div>
          </div>
          <div class="tctl clapper-controls">
            <button class="btn" id="startBtn" onclick="toggleTimer()" data-i="start">开始专注</button>
            <button class="btn ghost" onclick="resetTimer()" data-i="reset">重置</button>
          </div>
        </div>
      </div>
      <div class="card manga-panel dashboard-panel">
        <h2 class="manga-title" data-i="dash">数据看板</h2>
        <div class="stats">
          <div class="stat"><b id="stFocus">0</b><small data-i="sFocus">今日专注(分)</small></div>
          <div class="stat"><b id="stPomo">0</b><small data-i="sPomo">番茄数</small></div>
          <div class="stat"><b id="stDone">0</b><small data-i="sDone">完成任务</small></div>
        </div>
        <div class="muted" style="margin-top:15px" data-i="trend">近 7 天专注趋势</div>
        <div class="bars" id="bars"></div>
      </div>
    </section>

    <!-- ========== 记录 ========== -->
    <section class="view manga-view journal-view" id="v-journal">
      <div class="card manga-panel journal-entry-panel">
        <div class="manga-decor film-decor" aria-hidden="true"></div>
        <div class="hint" data-i="jHint">这些记录只存在你自己的手机上，没有人能看到。诚实地写，才对你有用。</div>
        <h2 class="manga-title" data-i="jTitle">今天做了什么</h2>
        <textarea id="logText" data-ph="logPh" placeholder="不用写得漂亮。做了什么、什么感觉，随便记两句就行…"></textarea>
        <div class="muted" style="margin-top:10px" data-i="moodLabel">今天状态如何</div>
        <div class="moodpick" id="moodPick">
          <div data-m="😖">😖</div><div data-m="😕">😕</div>
          <div data-m="😐" class="sel">😐</div><div data-m="🙂">🙂</div><div data-m="😄">😄</div>
        </div>
        <div class="row"><button class="btn full" onclick="addLog()" data-i="saveLog">保存记录</button></div>
      </div>
      <div class="card manga-panel journal-list-panel">
        <h2 class="manga-title" data-i="history">历史记录</h2>
        <div id="logList"></div>
      </div>
    </section>
  </main>

  <nav>
    <button class="active" data-v="today" onclick="go('today',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
      <span data-i="navToday">今日</span></button>
    <button data-v="pool" onclick="go('pool',this)">
      <svg viewBox="0 0 24 24"><path d="M12 21c-4-3-7-6.5-7-10a7 7 0 0114 0c0 3.5-3 7-7 10z"/><path d="M12 11v6"/></svg>
      <span data-i="navPool">成长池</span></button>
    <button data-v="goals" onclick="go('goals',this)">
      <svg viewBox="0 0 24 24"><path d="M4 20V6"/><path d="M4 6h11l-2 3 2 3H4"/></svg>
      <span data-i="navGoals">目标</span></button>
    <button data-v="focus" onclick="go('focus',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 3h6"/></svg>
      <span data-i="navFocus">专注</span></button>
    <button data-v="journal" onclick="go('journal',this)">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h6"/></svg>
      <span data-i="navJournal">记录</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ i18n ============ */
const I18N={
 zh:{tagline:"反假性自律",loadTitle:"今日精力负荷",companionCat:'Power 猫',companionHuman:'人形 Power',
   loadWarn:"⚠️ 已超出今日承载范围。别急着加 —— 把非必要的任务放进成长池吧。",

   eLight:"轻 10",eMid:"中 25",eHeavy:"重 45",addToday:"加入今日",todayTasks:"今日任务",
   poolTitle:"成长池",poolDesc:"突然冒出来的想法先存这儿，不逼自己马上做。等状态好、精力有富余时，再一键转成今日任务。",
   ideaPh:"比如：想学一点心理学…",save:"存起来",myIdeas:"我的想法",toTask:"转为任务",

   pomo:"番茄钟",ready:"准备开始",start:"开始专注",pause:"暂停",resume:"继续",

   dash:"数据看板",sFocus:"今日专注(分)",sPomo:"番茄数",sDone:"完成任务",trend:"近 7 天专注趋势",
   jTitle:"今天做了什么",jHint:"这些记录只存在你自己的手机上，没有人能看到。诚实地写，才对你有用。",
   logPh:"不用写得漂亮。做了什么、什么感觉，随便记两句就行…",moodLabel:"今天状态如何",
   saveLog:"保存记录",history:"历史记录",
   navToday:"今日",navPool:"成长池",navGoals:"目标",navFocus:"专注",navJournal:"记录",
   emptyTask:"还没有任务，加一个吧",emptyIdea:"成长池是空的～想法随手记这里",
   emptyGoal:"还没有目标。目标是方向，不是压力。",emptyLog:"还没有记录。从今天开始吧。",
   savedLog:"记录已保存",movedTask:"已移到今日任务",days:["一","二","三","四","五","六","日"],
   overload:"负荷已超载，这条先进成长池了"},
 en:{tagline:"Anti-fake-productivity",loadTitle:"Today's energy load",companionCat:'Power Cat',companionHuman:'Human Power',
   loadWarn:"⚠️ You're over today's capacity. Don't push — move the non-essential ones to your Growth Pool.",
   addTask:"Add a task",taskPh:"What do you want to get done today?",energyLabel:"Estimated energy cost",
   eLight:"Light 10",eMid:"Medium 25",eHeavy:"Heavy 45",addToday:"Add to today",todayTasks:"Today's tasks",
   poolTitle:"Growth pool",poolDesc:"Park sudden ideas here without forcing yourself to act now. Turn them into tasks when you actually have energy to spare.",
   ideaPh:"e.g. I want to learn some psychology…",save:"Save",myIdeas:"My ideas",toTask:"Make a task",
   addGoal:"New goal",goalPh:"e.g. Read 12 books",unitPh:"unit",create:"Create",myGoals:"My goals",
   pomo:"Pomodoro",ready:"Ready",start:"Start focus",pause:"Pause",resume:"Resume",
   focusing:"Focusing…",paused:"Paused",doneOne:"One pomodoro done 🎉",again:"One more",reset:"Reset",
   dash:"Dashboard",sFocus:"Focus (min)",sPomo:"Pomodoros",sDone:"Tasks done",trend:"Last 7 days",
   jTitle:"What did you do today?",jHint:"These entries stay on your own device. Nobody else can see them. Be honest — that's the point.",
   logPh:"No need to make it pretty. What you did, how it felt. Two lines is enough…",moodLabel:"How was today?",
   saveLog:"Save entry",history:"Past entries",
   navToday:"Today",navPool:"Pool",navGoals:"Goals",navFocus:"Focus",navJournal:"Journal",
   emptyTask:"No tasks yet. Add one.",emptyIdea:"Your growth pool is empty — jot ideas here.",
   emptyGoal:"No goals yet. A goal is a direction, not pressure.",emptyLog:"No entries yet. Start today.",
   savedLog:"Entry saved",movedTask:"Moved to today's tasks",days:["M","T","W","T","F","S","S"],
   overload:"You're overloaded — parked it in the pool instead"}
};
let lang = localStorage.getItem('ll_lang') || 'zh';
const T = k => I18N[lang][k];

function applyLang(){
  document.documentElement.lang = lang==='zh'?'zh-CN':'en';
  document.getElementById('langBtn').textContent = lang==='zh'?'EN':'中';
  document.getElementById('tagline').textContent = T('tagline');
  document.querySelectorAll('[data-i]').forEach(el=>{
    const v=I18N[lang][el.dataset.i]; if(v!==undefined) el.textContent=v;
  });
  document.querySelectorAll('[data-ph]').forEach(el=>{
    const v=I18N[lang][el.dataset.ph]; if(v!==undefined) el.placeholder=v;
  });
  renderAll();
}
function toggleLang(){ lang = lang==='zh'?'en':'zh'; localStorage.setItem('ll_lang',lang); applyLang(); }

/* ============ storage ============ */
const DB={
  get(k,d){try{const v=localStorage.getItem('ll_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ll_'+k,JSON.stringify(v))}catch(e){}}
};
const today = () => new Date().toISOString().slice(0,10);

let S={
  companion:DB.get('companion', 'cat')==='human'?'human':'cat',
  loadMax:DB.get('loadMax',100),
  tasks:DB.get('tasks',[]),
  ideas:DB.get('ideas',[]),
  goals:DB.get('goals',[]),
  logs:DB.get('logs',[]),
  focusMin:DB.get('focusMin',0),
  pomo:DB.get('pomo',0),
  week:DB.get('week',[0,0,0,0,0,0,0]),
  lastDay:DB.get('lastDay',today())
};

/* 跨天重置：把今日专注归零，趋势数组左移 */
(function rollover(){
  const t=today();
  if(S.lastDay!==t){
    const gap=Math.min(7,Math.max(1,Math.round((new Date(t)-new Date(S.lastDay))/864e5)));
    for(let i=0;i<gap;i++){ S.week.shift(); S.week.push(0); }
    S.focusMin=0; S.pomo=0; S.lastDay=t;
    S.tasks=S.tasks.filter(x=>!x.done);
    DB.set('week',S.week);DB.set('focusMin',0);DB.set('pomo',0);
    DB.set('lastDay',t);DB.set('tasks',S.tasks);
  }
})();

let pickedEnergy=25, pickedMood='😐';

/* ============ nav ============ */
function go(v,el){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.querySelector('main').scrollTop=0;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1900);
}

/* ============ 负荷 + 任务 ============ */
function companionVideoSrc(companion,state){
  return `assets/power-${companion}/${state}.mp4`;
}
function renderCompanion(state){
  const video=document.getElementById('companionVideo');
  const src=companionVideoSrc(S.companion,state);
  if(video.getAttribute('src')!==src){
    video.src=src; video.load(); video.play().catch(()=>{});
  }
  document.querySelectorAll('[data-companion]').forEach(btn=>
    btn.setAttribute('aria-pressed',String(btn.dataset.companion===S.companion)));
}
function setCompanion(companion){
  S.companion=companion==='human'?'human':'cat';
  DB.set('companion',S.companion);
  renderLoad();
}
function renderLoad(){
  const used=S.tasks.filter(t=>!t.done).reduce((s,t)=>s+t.energy,0);
  const max=S.loadMax, pct=Math.min(100,used/max*100);
  document.getElementById('loadUsed').textContent=used;
  document.getElementById('loadMax').textContent=max;
  const bar=document.getElementById('loadBar');
  bar.style.width=pct+'%';
  bar.style.background = used>max?'var(--danger)':used>max*0.8?'var(--warn)':'var(--ok)';
  document.getElementById('loadWarn').classList.toggle('show',used>max);

  const state = used===0 ? 'idle' : used>max ? 'exhausted' : used>max*0.8 ? 'tired' : 'content';
  renderCompanion(state);
}
function renderTasks(){
  const box=document.getElementById('taskList');
  box.innerHTML = S.tasks.length
    ? S.tasks.map(t=>`<div class="item manga-task ${t.done?'done':''}">
        <div class="chk" onclick="toggleTask(${t.id})">${t.done?'✓':''}</div>
        <div class="t">${esc(t.name)}</div>
        <div class="tag">⚡${t.energy}</div>
        <div class="x" onclick="delTask(${t.id})">×</div></div>`).join('')
    : `<div class="empty">${T('emptyTask')}</div>`;
  renderLoad(); renderStats();
}
function addTask(){
  const el=document.getElementById('taskName'), name=el.value.trim();
  if(!name) return;
  S.tasks.push({id:Date.now(),name,energy:pickedEnergy,done:false});
  el.value=''; DB.set('tasks',S.tasks); renderTasks();
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id); if(!t)return;
  t.done=!t.done; DB.set('tasks',S.tasks); renderTasks();
}
function delTask(id){ S.tasks=S.tasks.filter(x=>x.id!==id); DB.set('tasks',S.tasks); renderTasks(); }
document.getElementById('energyPick').addEventListener('click',e=>{
  const d=e.target.closest('[data-e]'); if(!d)return;
  pickedEnergy=+d.dataset.e;
  document.querySelectorAll('#energyPick div').forEach(x=>x.classList.remove('sel'));
  d.classList.add('sel');
});

/* ============ 成长池 ============ */
function renderIdeas(){
  const box=document.getElementById('ideaList');
  box.innerHTML = S.ideas.length
    ? S.ideas.map(i=>`<div class="item torn-note">
        <div class="t">${esc(i.name)}</div>
        <button class="btn ghost sm" onclick="promote(${i.id})">${T('toTask')}</button>
        <div class="x" onclick="delIdea(${i.id})">×</div></div>`).join('')
    : `<div class="empty">${T('emptyIdea')}</div>`;
}
function addIdea(){
  const el=document.getElementById('ideaName'), name=el.value.trim();
  if(!name) return;
  S.ideas.push({id:Date.now(),name}); el.value='';
  DB.set('ideas',S.ideas); renderIdeas();
}
function delIdea(id){ S.ideas=S.ideas.filter(x=>x.id!==id); DB.set('ideas',S.ideas); renderIdeas(); }
function promote(id){
  const i=S.ideas.find(x=>x.id===id); if(!i)return;
  S.tasks.push({id:Date.now(),name:i.name,energy:25,done:false});
  S.ideas=S.ideas.filter(x=>x.id!==id);
  DB.set('tasks',S.tasks); DB.set('ideas',S.ideas);
  renderIdeas(); renderTasks(); toast(T('movedTask'));
  go('today',document.querySelector('nav button[data-v=today]'));
}

/* ============ 目标 ============ */
function renderGoals(){
  const box=document.getElementById('goalList');
  box.innerHTML = S.goals.length
    ? S.goals.map(g=>{
        const pct=Math.min(100,Math.round(g.cur/g.target*100));
        return `<div class="goal chapter-card">
          <div class="gt"><b>${esc(g.name)}</b><div class="x" onclick="delGoal(${g.id})">×</div></div>
          <div class="gbar"><span style="width:${pct}%"></span></div>
          <div class="gfoot">
            <small>${g.cur} / ${g.target} ${esc(g.unit||'')} · ${pct}%</small>
            <button class="step" onclick="stepGoal(${g.id},-1)">−</button>
            <button class="step" onclick="stepGoal(${g.id},1)">+</button>
          </div></div>`;
      }).join('')
    : `<div class="empty">${T('emptyGoal')}</div>`;
}
function addGoal(){
  const n=document.getElementById('goalName'), tg=document.getElementById('goalTarget'), u=document.getElementById('goalUnit');
  const name=n.value.trim(), target=Math.max(1,parseInt(tg.value)||1);
  if(!name) return;
  S.goals.push({id:Date.now(),name,target,cur:0,unit:u.value.trim()});
  n.value=''; u.value=''; tg.value=10;
  DB.set('goals',S.goals); renderGoals();
}
function stepGoal(id,d){
  const g=S.goals.find(x=>x.id===id); if(!g)return;
  g.cur=Math.max(0,Math.min(g.target,g.cur+d));
  DB.set('goals',S.goals); renderGoals();
}
function delGoal(id){ S.goals=S.goals.filter(x=>x.id!==id); DB.set('goals',S.goals); renderGoals(); }

/* ============ 番茄钟 ============ */
const TOTAL=25*60, RING=502.4;
let left=TOTAL, timer=null, running=false;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function drawRing(){
  document.getElementById('clock').textContent=fmt(left);
  document.getElementById('ringFg').style.strokeDashoffset=RING*(1-left/TOTAL);
}
function toggleTimer(){
  if(running){
    clearInterval(timer); running=false;
    document.getElementById('startBtn').textContent=T('resume');
    document.getElementById('clabel').textContent=T('paused');
    return;
  }
  running=true;
  document.getElementById('startBtn').textContent=T('pause');
  document.getElementById('clabel').textContent=T('focusing');
  timer=setInterval(()=>{ left--; drawRing(); if(left<=0) finishPomo(); },1000);
}
function resetTimer(){
  clearInterval(timer); running=false; left=TOTAL; drawRing();
  document.getElementById('startBtn').textContent=T('start');
  document.getElementById('clabel').textContent=T('ready');
}
function finishPomo(){
  clearInterval(timer); running=false;
  S.pomo++; S.focusMin+=25; S.week[6]+=25;
  DB.set('pomo',S.pomo); DB.set('focusMin',S.focusMin); DB.set('week',S.week);
  document.getElementById('clabel').textContent=T('doneOne');
  document.getElementById('startBtn').textContent=T('again');
  left=TOTAL; drawRing(); renderStats();
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}

/* ============ 看板 ============ */
function renderStats(){
  document.getElementById('stFocus').textContent=S.focusMin;
  document.getElementById('stPomo').textContent=S.pomo;
  document.getElementById('stDone').textContent=S.tasks.filter(t=>t.done).length;
  const max=Math.max(...S.week,1), days=T('days');
  document.getElementById('bars').innerHTML=S.week.map((v,i)=>
    `<div class="b"><i style="height:${Math.round(v/max*100)}%"></i><span>${days[i]}</span></div>`).join('');
}

/* ============ 记录 ============ */
function renderLogs(){
  const box=document.getElementById('logList');
  box.innerHTML = S.logs.length
    ? S.logs.slice().reverse().map(l=>`<div class="log film-frame">
        <div class="lh"><span class="mood">${l.mood}</span><b>${l.date}</b>
        <div class="x" style="margin-left:auto" onclick="delLog(${l.id})">×</div></div>
        <p>${esc(l.text)}</p></div>`).join('')
    : `<div class="empty">${T('emptyLog')}</div>`;
}
function addLog(){
  const el=document.getElementById('logText'), text=el.value.trim();
  if(!text) return;
  S.logs.push({id:Date.now(),date:today(),mood:pickedMood,text});
  el.value=''; DB.set('logs',S.logs); renderLogs(); toast(T('savedLog'));
}
function delLog(id){ S.logs=S.logs.filter(x=>x.id!==id); DB.set('logs',S.logs); renderLogs(); }
document.getElementById('moodPick').addEventListener('click',e=>{
  const d=e.target.closest('[data-m]'); if(!d)return;
  pickedMood=d.dataset.m;
  document.querySelectorAll('#moodPick div').forEach(x=>x.classList.remove('sel'));
  d.classList.add('sel');
});

/* ============ utils ============ */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderAll(){ renderTasks(); renderIdeas(); renderGoals(); renderLogs(); renderStats(); }
document.getElementById('taskName').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
document.getElementById('ideaName').addEventListener('keydown',e=>{if(e.key==='Enter')addIdea()});
document.getElementById('goalName').addEventListener('keydown',e=>{if(e.key==='Enter')addGoal()});

/* ============ init ============ */
applyLang(); drawRing();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
